[wallpaper]
directory = "@home@/Pictures/Wallpapers"
transition_on_startup = true

    [wallpaper.automation]
    enabled = true
    interval_seconds = 120

    [wallpaper.default]
    path = "@home@/Pictures/Wallpapers/ogarart-sunset-2.jpg"

    [wallpaper.last]
    path = "@home@/Pictures/Wallpapers/ogarart-sunset-2.jpg"

    [wallpaper.monitors.eDP-1]
    path = "@home@/Pictures/Wallpapers/ogarart-sunset-2.jpg"

# --- backdrop.toml ---
[backdrop]
blur_intensity = 0.12999999709427357
tint_intensity = 0.079999998211860657

# --- bar.toml ---
[bar.default]
background_opacity = 0.81999999999999995
center = [ "clock", "weather", "cat" ]
end = [ "tray", "notifications", "clipboard", "network", "bluetooth", "volume", "brightness", "battery", "session" ]
font_scale = 1.0
margin_ends = 12
radius_bottom_left = 14
radius_bottom_right = 14
scale = 1.0000000074505806
start = [ "launcher", "wallpaper", "workspaces", "switch" ]
thickness = 35

# --- battery.toml ---
[battery]
warning_threshold = 20

# --- brightness.toml ---
[brightness]
minimum_brightness = 0.0099999997764825821
sync_all_monitors = true

# --- control_center.toml ---
[[control_center.shortcuts]]
type = "wifi"
[[control_center.shortcuts]]
type = "bluetooth"
[[control_center.shortcuts]]
type = "caffeine"
[[control_center.shortcuts]]
type = "nightlight"
[[control_center.shortcuts]]
type = "power_profile"
[[control_center.shortcuts]]
type = "dark_mode"

# --- idle.toml ---
[idle]
behavior_order = [ "lock", "screen-off", "lock-and-suspend" ]

    [idle.behavior.lock]
    action = "lock"
    enabled = true
    timeout = 300.0

    [idle.behavior.lock-and-suspend]
    action = "lock_and_suspend"
    enabled = true
    timeout = 720.0

    [idle.behavior.screen-off]
    action = "screen_off"
    enabled = true
    timeout = 600.0

# --- location.toml ---
[location]
address = "Butwal,Nepal"

# --- lockscreen_widgets.toml ---
[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@eDP-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 719.9998779296875
    cy = 628.00006103515625
    output = "eDP-1"
    placement_height = 810.0
    placement_width = 1440.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_password_reveal = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

# --- nightlight.toml ---
[nightlight]
enabled = true

# --- notification.toml ---
[notification]
history_retention_hours = 1

# --- osd.toml ---
[osd]
background_opacity = 0.69999999999999996

# --- plugins.toml ---
[plugins]
enabled = [ "dotnetrob/cat", "kavya-nama/wallpaper-switcher" ]

    [[plugins.source]]
    kind = "git"
    location = "https://github.com/noctalia-dev/official-plugins"
    name = "official"

    [[plugins.source]]
    kind = "git"
    location = "https://github.com/noctalia-dev/community-plugins"
    name = "community"

# --- shell.toml ---
[shell]
clipboard_auto_paste = "ctrl_v"
clipboard_confirm_clear_history = false
clipboard_keep_from_closed_apps = true
font_family = "Noto Sans"
password_style = "random"
polkit_agent = true
screen_time_enabled = true
settings_show_advanced = false

    [shell.greeter_sync]
    auto_sync = true

    [shell.launcher]
    categories = false
    default_view = "all"
    layout = "simple"

    [shell.panel]
    session_placement = "floating"
    session_position = "center"

# --- theme.toml ---
[theme]
builtin = "Catppuccin"
community_palette = "Oxocarbon"
mode = "auto"
source = "wallpaper"
wallpaper_scheme = "m3-content"

    [theme.templates]
    builtin_ids = [ "niri", "gtk3", "gtk4", "qt", "alacritty" ]
    community_ids = [ "libreoffice", "fastfetch", "fcitx5" ]
    enable_builtin_templates = true

# --- wallpaper.toml ---
[wallpaper]
directory = "/home/sanzay/Pictures/Wallpapers"
transition_on_startup = true

    [wallpaper.automation]
    enabled = true
    interval_seconds = 120

    [wallpaper.default]
    path = "/home/sanzay/Pictures/Wallpapers/afreen-red-sunset-horizon.png"

    [wallpaper.last]
    path = "/home/sanzay/Pictures/Wallpapers/afreen-red-sunset-horizon.png"

    [wallpaper.monitors.eDP-1]
    path = "/home/sanzay/Pictures/Wallpapers/afreen-red-sunset-horizon.png"

# --- widget.toml ---
[widget.cat]
run_threshold = 40
type = "dotnetrob/cat:cat"
[widget.media]
enabled = false
[widget.switch]
type = "kavya-nama/wallpaper-switcher:switch"
